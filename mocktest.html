// SUBJECT CARDS

const subjectGrid = document.getElementById("subjectGrid");

Object.keys(questionBank).forEach(subject => {

    const card = document.createElement("div");

    card.className = "subject-card";

    card.innerHTML = `
        <h3>📚 ${subject}</h3>
        <p>20 Questions Available</p>
        <p>10 Questions Per Attempt</p>
        <button onclick="startTest('${subject}')">
            Start Mock Test →
        </button>
    `;

    subjectGrid.appendChild(card);

});


// TEST VARIABLES

let questions = [];
let current = 0;
let score = 0;
let selected = null;
let finished = false;
let timeLeft = 300;
let timerInterval;
let topicResults = {};
let selectedSubject = "";


// RANDOM QUESTION SELECTION

function shuffle(array) {

    const copy = [...array];

    for(let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];

    }

    return copy;

}


// START TEST

function startTest(subject) {

    selectedSubject = subject;

    questions = shuffle(questionBank[subject]).slice(0,10);

    current = 0;
    score = 0;
    selected = null;
    finished = false;
    timeLeft = 300;
    topicResults = {};

    document.getElementById("subjectSection").style.display = "none";

    document.getElementById("testSection").style.display = "block";

    document.getElementById("testTitle").textContent =
        subject + " Mock Test";

    document.getElementById("result").textContent = "";

    document.getElementById("saveStatus").textContent = "";

    document.getElementById("nextBtn").style.display = "inline-block";

    loadQuestion();

    updateTimer();

    clearInterval(timerInterval);

    timerInterval = setInterval(updateTimer,1000);

}


// LOAD QUESTION

function loadQuestion() {

    selected = null;

    document.getElementById("questionCount").textContent =
        "Question " + (current + 1) + " of 10";

    document.getElementById("question").textContent =
        questions[current].q;

    const options = document.getElementById("options");

    options.innerHTML = "";

    questions[current].o.forEach((option,index) => {

        const label = document.createElement("label");

        label.className = "option";

        const radio = document.createElement("input");

        radio.type = "radio";
        radio.name = "answer";
        radio.value = index;

        radio.addEventListener("change", () => {

            selected = index;

        });

        label.appendChild(radio);

        label.append(" " + option);

        options.appendChild(label);

    });

}


// NEXT QUESTION

function nextQuestion() {

    if(finished) return;

    if(selected === null) {

        alert("Please select an answer!");

        return;

    }

    if(selected === questions[current].a) {

        score++;

    }

    current++;

    if(current < questions.length) {

        loadQuestion();

    } else {

        finishTest();

    }

}


// FINISH TEST AND SAVE

async function finishTest() {

    if(finished) return;

    finished = true;

    clearInterval(timerInterval);

    document.getElementById("question").textContent =
        "Test Completed! 🎉";

    document.getElementById("questionCount").textContent = "";

    document.getElementById("options").innerHTML = "";

    document.getElementById("nextBtn").style.display = "none";

    const percentage = Math.round(score / questions.length * 100);

    document.getElementById("result").innerHTML =
        "Subject: " + selectedSubject +
        "<br>Your Score: " + score + "/10" +
        "<br>Accuracy: " + percentage + "%";

    const user = JSON.parse(
        localStorage.getItem("careerMateUser") || "null"
    );

    const studentId = user?.id || user?._id;

    if(!studentId) {

        document.getElementById("saveStatus").textContent =
            "Please login again to save your result.";

        return;

    }

    document.getElementById("saveStatus").textContent =
        "Saving your result...";

    try {

        const response = await fetch(
            "http://localhost:5001/api/performance/save",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    studentId: studentId,

                    category: "Mock Test",

                    topic: selectedSubject,

                    score: score,

                    totalQuestions: questions.length

                })
            }
        );

        if(!response.ok) {

            throw new Error("Unable to save mock test result.");

        }

        const history = JSON.parse(
            localStorage.getItem("careerMateResults") || "[]"
        );

        history.push({

            studentId: studentId,

            test: selectedSubject + " Mock Test",

            score: score,

            total: questions.length,

            percentage: percentage,

            date: new Date().toLocaleString()

        });

        localStorage.setItem(
            "careerMateResults",
            JSON.stringify(history)
        );

        document.getElementById("saveStatus").textContent =
            "✅ Result saved successfully! Your analytics have been updated.";

    } catch(error) {

        console.error(error);

        document.getElementById("saveStatus").textContent =
            "❌ Result could not be saved. Please check your backend.";

    }

}


// TIMER

function updateTimer() {

    const minutes = Math.floor(timeLeft / 60);

    const seconds = timeLeft % 60;

    document.getElementById("timer").textContent =
        "Time: " + minutes + ":" +
        String(seconds).padStart(2,"0");

    if(timeLeft <= 0) {

        finishTest();

        return;

    }

    timeLeft--;

}
